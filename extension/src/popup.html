<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Yui</title>
<style>
  :root { --bg: #0d0b12; --line: rgba(255,255,255,.08); --txt: #f1eef8; --dim: #a79fbb; --faint: #5f5773;
          --pink: #ff6fae; --violet: #7c5cff; --teal: #34d5c9; --ok: #34d5c9; --bad: #ff5c8a; --warn: #ffd166; }
  html, body { margin: 0; background: var(--bg); color: var(--txt); font: 13px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  body { width: 300px; padding: 14px 14px 12px; box-sizing: border-box;
         background: radial-gradient(160px 90px at 12% -10%, rgba(255,111,174,.22), transparent 70%),
                     radial-gradient(160px 90px at 100% 0%, rgba(124,92,255,.2), transparent 70%), var(--bg); }
  .hd { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .hd img { width: 38px; height: 38px; filter: drop-shadow(0 3px 10px rgba(255,111,174,.4)); }
  .hd b { font-size: 15px; letter-spacing: .01em; }
  .hd .sub { font-size: 11px; color: var(--faint); line-height: 1.2; }
  label { display: block; font-size: 11px; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--faint); margin: 10px 0 5px; }
  input[type=text] { width: 100%; box-sizing: border-box; background: rgba(255,255,255,.05); border: 1px solid var(--line); color: var(--txt);
          border-radius: 10px; padding: 8px 10px; font: 12.5px ui-monospace, Menlo, Consolas, monospace; outline: none; }
  input[type=text]:focus { border-color: rgba(255,111,174,.5); }
  input.bad { border-color: var(--bad); }
  .hint { color: var(--faint); font-size: 11px; margin-top: 5px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
  .row:first-of-type { border-top: 0; }
  .row .l { font-size: 12.5px; } .row .l small { display: block; color: var(--faint); font-size: 11px; }
  .sw { position: relative; width: 36px; height: 20px; flex: 0 0 auto; }
  .sw input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .sw i { position: absolute; inset: 0; border-radius: 20px; background: rgba(255,255,255,.12); transition: background .15s; }
  .sw i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .15s; }
  .sw input:checked + i { background: linear-gradient(90deg, var(--pink), var(--violet)); }
  .sw input:checked + i::after { transform: translateX(16px); }
  select { background: rgba(255,255,255,.05); color: var(--txt); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; font: inherit; font-size: 12px; }
  .status { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--dim); margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); }
  .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--faint); flex: 0 0 auto; }
  .status.ok::before { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
  .status.err::before { background: var(--bad); } .status.warn::before { background: var(--warn); }
  .status.wait::before { background: var(--warn); animation: blink 1s infinite; }
  @keyframes blink { 50% { opacity: .3; } }
  .btns { display: flex; gap: 8px; margin-top: 10px; }
  button { flex: 1; border: 0; border-radius: 10px; padding: 8px 10px; font: 600 12.5px inherit; cursor: pointer; color: #fff;
           background: linear-gradient(135deg, var(--pink), var(--violet)); }
  button.ghost { background: rgba(255,255,255,.07); color: var(--txt); }
  button:disabled { opacity: .45; cursor: default; }
  .foot { margin-top: 10px; font-size: 11px; color: var(--faint); display: flex; justify-content: space-between; }
  .foot a { color: var(--dim); text-decoration: none; } .foot a:hover { color: var(--txt); }
  #nothere { display: none; color: var(--dim); font-size: 12px; padding: 8px 0 2px; }
</style>
</head>
<body>
<div class="hd"><img src="icons/icon48.png" alt=""><div><b>Yui</b><div class="sub">your trading companion</div></div></div>

<label for="wallet">Wallet you trade from</label>
<input type="text" id="wallet" placeholder="paste a Solana address" spellcheck="false" autocomplete="off">
<div class="hint">A public address, nothing to sign. Several: separate with spaces.</div>

<div id="nothere">She doesn't appear on this site. Open a supported terminal to see her.</div>
<div id="siteRows">
  <div class="row"><div class="l">Show her on <span id="host">this site</span></div><span class="sw"><input type="checkbox" id="onHere" checked><i></i></span></div>
  <div class="row"><div class="l">Frame rate<small>30 keeps a busy terminal lighter</small></div>
    <select id="fps"><option value="0">60 fps</option><option value="30">30 fps</option></select></div>
</div>

<div class="status" id="status">Checking…</div>
<div class="btns"><button id="save">Save</button><button class="ghost" id="open" disabled>Open her panel</button></div>
<div class="foot"><a href="https://tradingcompanion.fun" target="_blank" rel="noopener">tradingcompanion.fun</a><span id="ver"></span></div>
<script src="popup.js"></script>
</body>
</html>
